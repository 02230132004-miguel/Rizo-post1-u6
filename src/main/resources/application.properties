spring.application.name=pedidos-service

# Configuracion de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:pedidos_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ejecucion automatica de schema.sql y data.sql
spring.sql.init.mode=always

# Habilitacion de consola web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de promociones activas
promo.black-friday.activa=true
